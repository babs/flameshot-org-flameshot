name: Release(babs)

# Dispatch on a tag (gh workflow run release-babs.yml --ref <tag>): the pack
# workflows check out github.sha only for workflow_dispatch events.
# Dispatched on a branch, it builds everything and publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/Linux-pack.yml

  macos:
    uses: ./.github/workflows/MacOS-pack.yml

  windows:
    uses: ./.github/workflows/Windows-pack.yml

  release:
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-babs')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect assets
        shell: bash
        run: |
          mkdir assets
          # Both macOS jobs emit the same Flameshot-<version>.dmg name
          for d in dist/*-artifact-macos-*; do
            f=$(ls "$d"/*.dmg)
            mv "$f" "assets/$(basename "$f" .dmg)-macos-${d##*-}.dmg"
          done
          # Snap is left out: snapcraft.yaml builds the upstream tag, not this tree
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.flatpak' -o -name '*.msi' -o -name '*.zip' \) -exec mv -t assets {} +
          cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flameshot $GITHUB_REF_NAME" \
            --notes "Unofficial Flameshot build, not supported by flameshot-org. Report issues on this repository.

          Adds on top of upstream master:
          - Emoji stamp tool (flameshot-org/flameshot#4971)
          - Capture all monitors as one image on X11 (flameshot-org/flameshot#4984)

          Windows and macOS binaries are unsigned."
